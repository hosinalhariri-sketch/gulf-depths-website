<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="30%" style="stop-color:#F0D060"/>
      <stop offset="60%" style="stop-color:#B8860B"/>
      <stop offset="100%" style="stop-color:#E8C547"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1428"/>
      <stop offset="100%" style="stop-color:#050B1A"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0D060"/>
      <stop offset="50%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4"/>
  
  <!-- Inner circle background -->
  <circle cx="100" cy="100" r="82" fill="url(#navyGrad)"/>
  
  <!-- Decorative dots around ring -->
  <circle cx="100" cy="8" r="2.5" fill="#D4AF37"/>
  <circle cx="100" cy="192" r="2.5" fill="#D4AF37"/>
  <circle cx="8" cy="100" r="2.5" fill="#D4AF37"/>
  <circle cx="192" cy="100" r="2.5" fill="#D4AF37"/>
  <circle cx="35" cy="35" r="2" fill="#D4AF37" opacity="0.6"/>
  <circle cx="165" cy="35" r="2" fill="#D4AF37" opacity="0.6"/>
  <circle cx="35" cy="165" r="2" fill="#D4AF37" opacity="0.6"/>
  <circle cx="165" cy="165" r="2" fill="#D4AF37" opacity="0.6"/>
  
  <!-- Wave layers representing "Gulf Depths" -->
  <!-- Deep wave (bottom) -->
  <path d="M 30 130 Q 50 115 70 130 Q 90 145 110 130 Q 130 115 150 130 Q 165 140 170 130 L 170 155 L 30 155 Z" 
        fill="url(#waveGrad)" opacity="0.3"/>
  <!-- Middle wave -->
  <path d="M 30 115 Q 50 100 70 115 Q 90 130 110 115 Q 130 100 150 115 Q 165 125 170 115 L 170 140 L 30 140 Z" 
        fill="url(#waveGrad)" opacity="0.5"/>
  <!-- Top wave -->
  <path d="M 30 100 Q 50 85 70 100 Q 90 115 110 100 Q 130 85 150 100 Q 165 110 170 100 L 170 125 L 30 125 Z" 
        fill="url(#waveGrad)" opacity="0.7"/>
  <!-- Surface wave -->
  <path d="M 30 85 Q 50 70 70 85 Q 90 100 110 85 Q 130 70 150 85 Q 165 95 170 85 L 170 110 L 30 110 Z" 
        fill="url(#waveGrad)" opacity="0.9"/>
  
  <!-- Sun/star above waves -->
  <circle cx="100" cy="55" r="18" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="100" cy="55" r="12" fill="#050B1A"/>
  <circle cx="100" cy="55" r="8" fill="url(#goldGrad)"/>
  
  <!-- Construction crane silhouette integrated -->
  <g transform="translate(100, 55)" opacity="0.9">
    <!-- Crane arm -->
    <line x1="-20" y1="-8" x2="20" y2="-8" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Crane hook -->
    <line x1="15" y1="-8" x2="15" y2="2" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="12" y1="2" x2="18" y2="2" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Crane base -->
    <line x1="-5" y1="-8" x2="-5" y2="8" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
    <line x1="-10" y1="8" x2="0" y2="8" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Bottom text arc -->
  <path id="textArc" d="M 40 160 A 60 60 0 0 0 160 160" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="11" fill="#D4AF37" font-weight="bold" letter-spacing="2">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">GULF DEPTHS LIMITED</textPath>
  </text>
</svg>